# Paid service + persistent disk. Review pricing before creating the service.
services:
  - type: web
    name: study-buddy-backend
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: study-buddy-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STUDY_BUDDY_PROXY_SECRET
        sync: false
      - key: STUDY_BUDDY_MAX_STARTS_PER_DAY
        value: "20"
      - key: STUDY_BUDDY_DATABASE
        value: /var/data/workbook-live.sqlite
